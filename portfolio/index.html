        <!-- watercolor colors -->
        <defs>
            <radialGradient id="rose-watercolor">
                <stop offset="0%" stop-color="#C66B79" stop-opacity="0.45"/>
                <stop offset="65%" stop-color="#E7A6AE" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#E7A6AE" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="amber-watercolor">
                <stop offset="0%" stop-color="#D8A14B" stop-opacity="0.45"/>
                <stop offset="65%" stop-color="#F0D19A" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#F0D19A" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="purple-watercolor">
                <stop offset="0%" stop-color="#8B83BC" stop-opacity="0.45"/>
                <stop offset="65%" stop-color="#C3BCE0" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#C3BCE0" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="sage-watercolor">
                <stop offset="0%" stop-color="#849B80" stop-opacity=".52"/>
                <stop offset="65%" stop-color="#B7C7AC" stop-opacity=".30"/>
                <stop offset="100%" stop-color="#B7C7AC" stop-opacity="0"/>
            </radialGradient>
            
            <!-- watercolor texture -->
            <filter id="watercolor-texture"
                x="-30%" y="-30%"
                width="160%" height="160%">
            
            <!-- cloud-like noise -->
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.025"
                numOctaves="3"
                seed="4"
                result="noise"
            />
            <!-- distorts edges -->
            <feDisplacementMap
                in="SourceGraphic"
                in2="noise"
                scale="32"
                xChannelSelector="R"
                yChannelSelector="G"
                result="distorted"
            />

            <feGaussianBlur
                in="distorted"
                stdDeviation="4"
            />

            </filter>
        </defs>

        <!-- WATERCOLOR: hidden until hover -->
        <g class="watercolor-layer">
            <!--  watercolor slash for each section-->
            <g class="watercolor profile-color"
                 filter="url(#watercolor-texture)">
                 <!--  drawing custom shape; d = attribute, M = starting point, C = curved, z = closes shape-->

                    ry="65"

                </g>

            <g class="watercolor now-color"
